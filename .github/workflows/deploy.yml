name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Optimize favicon for Pages
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';

          const source = await readFile('public/logo.jpg');
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const sourceUrl = `data:image/jpeg;base64,${source.toString('base64')}`;

          const faviconUrl = await page.evaluate(async (src) => {
            const image = new Image();
            image.src = src;
            await image.decode();

            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d', { alpha: false });
            if (!context) throw new Error('Canvas 2D context unavailable');

            const scale = Math.max(size / image.naturalWidth, size / image.naturalHeight);
            const width = image.naturalWidth * scale;
            const height = image.naturalHeight * scale;
            context.drawImage(image, (size - width) / 2, (size - height) / 2, width, height);
            return canvas.toDataURL('image/png');
          }, sourceUrl);

          await browser.close();

          const encoded = faviconUrl.split(',')[1];
          if (!encoded) throw new Error('Failed to generate optimized favicon');
          await writeFile('dist/favicon-logo.png', Buffer.from(encoded, 'base64'));

          const indexPath = 'dist/index.html';
          let html = await readFile(indexPath, 'utf8');
          const iconPattern = /<link\s+rel="icon"\s+type="image\/jpeg"\s+href="\/InstaSniff\/logo\.jpg"\s*\/?>/;
          if (!iconPattern.test(html)) throw new Error('Expected favicon link not found in built index.html');

          html = html.replace(
            iconPattern,
            '<link rel="icon" type="image/png" sizes="128x128" href="/InstaSniff/favicon-logo.png?v=20260914" />',
          );
          await writeFile(indexPath, html);
          NODE
      - name: Browser E2E tests
        run: npx playwright test
      - name: Lighthouse CI audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/instasniff-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/InstaSniff/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/instasniff-preview.log
              exit 1
            fi
            sleep 1
          done

          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/InstaSniff/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-report.json
          node scripts/check-lighthouse.mjs lighthouse-report.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: ignore
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
